[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "er3t"
version = "0.2.0"
description = "Education and Research 3D Radiative Transfer Toolbox"
readme = "README.rst"
requires-python = ">=3.12"
license = {file = "LICENSE"}
keywords = [
    "3D",
    "radiation",
    "radiative transfer",
    "remote sensing",
    "atmospheric science"
    ]
authors = [
    {name = "Hong Chen", email = "hong.chen@hchen.com"},
    {name = "Vikas Nataraja", email = "vikas.hanasogenataraja@lasp.colorado.edu"},
    {name = "Yu-Wen Chen", email = "yu-wen.chen@colorado.edu"},
    {name = "Ken Hirata", email = "ken.hirata@colorado.edu"},
    {name = "Sebastian Schmidt", email = "sebastian.schmidt@lasp.colorado.edu"},
    ]
maintainers = [
    {name = "Hong Chen", email = "hong.chen@hchen.com"},
    ]
classifiers = [
    'Development Status :: 4 - Beta',
    'License :: OSI Approved :: GNU GPLv3 License',
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    'Topic :: Scientific/Engineering :: Atmospheric Science',
    ]
dependencies = [
    "cartopy>=0.25.0",
    "gdown>=5.2.0",
    "h5py>=3.15.1",
    "matplotlib>=3.10.7",
    "netcdf4>=1.7.3",
    "numpy>=2.3.5",
    "owslib>=0.35.0",
    "psutil>=7.1.3",
    "pyhdf>=0.11.6",
    "pysolar>=0.13",
    "requests>=2.32.5",
    "scikit-image>=0.25.2",
    "scipy>=1.16.3",
    "sphinx>=8.2.3",
    "sphinx-rtd-theme>=3.0.2",
    "tqdm>=4.67.1",
    "uuid-utils>=0.11.1",
    ]

[project.urls]
Homepage = "https://github.com/hong-chen/er3t"
Documentation = "https://er3t.readthedocs.io"
Chat = "https://discord.gg/ntqsguwaWv"

[project.scripts]
lss = "er3t.cli.lss:main"
lsa = "er3t.cli.lsa:main"
sdown = "er3t.cli.sdown:main"
